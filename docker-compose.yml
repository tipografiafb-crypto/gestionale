version: '3.8'

services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: orchestrator_user
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: print_orchestrator_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orchestrator_user -d print_orchestrator_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: bundle exec puma -b tcp://0.0.0.0:5000 config.ru
    ports:
      - "${HOST_PORT:-5010}:5000"
    volumes:
      - .:/app
      - ${AUTOMATION_DESTINATIONS_HOST_ROOT:-./storage/automation/destinations}:/destinations
    environment:
      - DATABASE_URL=postgresql://orchestrator_user:postgres123@db:5432/print_orchestrator_dev
      - RACK_ENV=development
      - PORT=5000
      - AUTOMATION_DESTINATIONS_ROOT=/destinations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  automation_worker:
    build: .
    command: bundle exec ruby -r ./app -e "AutomationWorker.run"
    restart: unless-stopped
    volumes:
      - .:/app
      - ${AUTOMATION_DESTINATIONS_HOST_ROOT:-./storage/automation/destinations}:/destinations
    environment:
      - DATABASE_URL=postgresql://orchestrator_user:postgres123@db:5432/print_orchestrator_dev
      - RACK_ENV=development
      - AUTOMATION_DESTINATIONS_ROOT=/destinations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    name: gestionale_local_halftone_postgres
    external: true
